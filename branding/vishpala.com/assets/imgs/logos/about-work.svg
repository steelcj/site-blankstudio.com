<svg aria-labelledby="about-work-title about-work-desc" xml:lang="en" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img">
  <title id="about-work-title">Vishpala</title>
  <desc id="about-work-desc">A De Stijl composition: rectangles of blue, yellow and red, divided by black rules.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="620" height="540" fill="#0033cc"/>
  <rect x="0" y="560" width="380" height="340" fill="#f2c200"/>
  <rect x="1200" y="0" width="400" height="300" fill="#f2c200"/>
  <rect x="1200" y="600" width="400" height="300" fill="#d00000"/>
  <g fill="#000000">
    <rect x="620" y="0" width="20" height="900"/>
    <rect x="1200" y="0" width="20" height="900"/>
    <rect x="0" y="540" width="640" height="20"/>
    <rect x="380" y="560" width="20" height="340"/>
    <rect x="1200" y="300" width="400" height="20"/>
    <rect x="1200" y="600" width="400" height="20"/>
  </g>
</svg>
